  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --hover: #f4f4f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card: #111113;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --line: #27272a;
        --hover: #18181b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 380px; }

    header { text-align: center; margin-bottom: 40px; }
    .avatar {
      display: block;
      width: 112px; height: 112px; border-radius: 50%;
      margin: 0 auto 20px;
      background: var(--hover);
      box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: -.025em; line-height: 1.2; }
    .tagline { color: var(--muted); margin-top: 8px; font-size: .9375rem; }
    .tagline span { display: block; }

    nav {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    nav a {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      color: inherit; text-decoration: none;
      transition: background .15s;
    }
    nav a + a { border-top: 1px solid var(--line); }
    nav a:hover, nav a:focus-visible { background: var(--hover); outline: none; }

    .icon { flex: none; display: grid; place-items: center; }
    .icon svg { width: 20px; height: 20px; }
    .label {
      flex: 1; min-width: 0;
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    }
    .label strong { font-weight: 500; }
    .label span { color: var(--muted); font-size: .875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arrow {
      flex: none; width: 16px; height: 16px; color: var(--muted);
      transition: transform .15s, color .15s;
    }
    nav a:hover .arrow { transform: translate(2px, -2px); color: var(--fg); }
  </style>
