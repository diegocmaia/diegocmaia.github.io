<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diego Maia</title>
  <meta name="description" content="Software developer. Projects on GitHub.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▍</text></svg>">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #e7e5e4;
        --muted: #a8a29e;
        --line: #292524;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    h1::before { content: "~/"; color: var(--muted); }
    .tagline { color: var(--muted); margin: 4px 0 40px; }
    h2 {
      font-size: .75rem; font-weight: 500; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 8px;
    }
    ul { list-style: none; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a.project {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 14px 0; color: inherit; text-decoration: none;
    }
    a.project span { color: var(--muted); font-size: .875rem; text-align: right; }
    a.project:hover strong, a.project:focus-visible strong { color: var(--accent); }
    a.project strong::after { content: " →"; opacity: 0; transition: opacity .15s; }
    a.project:hover strong::after { opacity: 1; }
    footer { margin-top: 40px; display: flex; gap: 20px; font-size: .875rem; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>diegocmaia</h1>
    <p class="tagline">Software developer. Building small, useful things.</p>

    <h2>Find me</h2>
    <ul>
      <li><a class="project" href="https://github.com/diegocmaia"><strong>github</strong><span>@diegocmaia</span></a></li>
      <li><a class="project" href="https://diegocmaia.github.io/aiam-photos/"><strong>photos</strong><span>aiam-photos</span></a></li>
      <!-- Add your URLs and uncomment:
      <li><a class="project" href="https://www.linkedin.com/in/YOUR-HANDLE/"><strong>linkedin</strong><span>in/YOUR-HANDLE</span></a></li>
      <li><a class="project" href="https://x.com/YOUR-HANDLE"><strong>x / twitter</strong><span>@YOUR-HANDLE</span></a></li>
      -->
    </ul>
  </main>
</body>
</html>
